name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.14.0", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - if: matrix.node == '24'
        run: npx playwright-core install --with-deps chromium
      - if: matrix.node == '24'
        run: EPOST_TEST_BROWSER=1 node --test test/browser.test.js
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check source history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          cd "$scanner_dir"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fsSLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_8.30.1_checksums.txt"
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scanner_dir/gitleaks" git --redact --no-banner .
